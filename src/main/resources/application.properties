spring.application.name=academic-warning

# ---------- 数据库连接 ----------
spring.datasource.url=jdbc:mysql://localhost:3306/score_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456

# ---------- 连接池健康配置（避免长时间运行后连接失效） ----------
# 连接最长存活 30 分钟，到期自动重建
spring.datasource.hikari.max-lifetime=1800000
# 每 5 分钟发一次心跳，保持连接活跃
spring.datasource.hikari.keepalive-time=300000
# 拿不到连接最多等 3 秒（默认 30 秒太久，出问题时应快速失败）
spring.datasource.hikari.connection-timeout=3000
# 借出连接前的校验等待时间
spring.datasource.hikari.validation-timeout=3000

# ---------- 学业预警阈值 ----------
warning.pass-score=60
warning.border-line=10

# ---------- JSON 响应格式化（仅便于调试查看，生产可关闭以省带宽） ----------
spring.jackson.serialization.indent-output=true
