spring.application.name=academic-warning

# ---------- 数据库连接 ----------
# 用 127.0.0.1 而不是 localhost：Windows 上 localhost 会优先解析成 IPv6 ::1，
# 而 MySQL 只监听 IPv4(0.0.0.0)，会导致偶发的 Failed to obtain JDBC Connection
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/score_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=123456

# ---------- 连接池健康配置（避免长时间运行后连接失效） ----------
# 连接最长存活 30 分钟，到期自动重建
spring.datasource.hikari.max-lifetime=1800000
# 每 5 分钟发一次心跳，保持连接活跃
spring.datasource.hikari.keepalive-time=300000
# 拿不到连接最多等 10 秒（MySQL 刚启动/机器休眠唤醒时建连接可能超过 3 秒）
spring.datasource.hikari.connection-timeout=10000
# 借出连接前的校验等待时间
spring.datasource.hikari.validation-timeout=3000

# ---------- MyBatis ----------
# 数据库下划线字段名 -> Java 驼峰属性名（如 create_time -> createTime）
mybatis.configuration.map-underscore-to-camel-case=true

# ---------- 学业预警阈值 ----------
warning.pass-score=60
warning.border-line=10

# ---------- JSON 响应格式化（仅便于调试查看，生产可关闭以省带宽） ----------
spring.jackson.serialization.indent-output=true
# ---------- DeepSeek API ----------
# Key 从环境变量 DEEPSEEK_API_KEY 读取，不写死在文件里（仓库是公开的）
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.api-url=https://api.deepseek.com/chat/completions
deepseek.model=deepseek-chat
# ---------- Redis ----------
spring.data.redis.host=localhost
spring.data.redis.port=6379
# 缓存过期时间：60 秒（缓存必须设过期，否则数据永远脏着）
spring.cache.redis.time-to-live=60s
